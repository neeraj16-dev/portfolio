<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Skin Tone Gradients -->
    <radialGradient id="faceGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E5A882" />
      <stop offset="60%" stop-color="#CE8C67" />
      <stop offset="100%" stop-color="#A96B48" />
    </radialGradient>
    <linearGradient id="rimWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#FF8A65" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFE0B2" stop-opacity="0.1" />
    </linearGradient>

    <!-- Hair Gradient with Rich Volume & Warm Rim -->
    <linearGradient id="hairGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#2D1C16" />
      <stop offset="40%" stop-color="#1A110D" />
      <stop offset="100%" stop-color="#0E0A08" />
    </linearGradient>
    <linearGradient id="hairRim" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FF8A65" stop-opacity="0.3" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Jacket Tan Khaki Color -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBD9A" />
      <stop offset="45%" stop-color="#CB9F7A" />
      <stop offset="100%" stop-color="#A57A54" />
    </linearGradient>

    <!-- White Undershirt -->
    <linearGradient id="shirtGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Group with soft shadow -->
  <g filter="url(#softGlow)">
    <!-- Back Hair Volume (behind ears & neck) -->
    <path d="M 280 200 C 260 120, 310 40, 420 30 C 510 25, 560 90, 550 190 C 540 250, 520 280, 500 290 C 470 305, 330 305, 300 290 Z" fill="#140D0A" />

    <!-- Shoulders & Jacket Body -->
    <!-- Left Shoulder / Body -->
    <path d="M 120 600 C 120 500, 220 440, 310 420 L 330 380 L 470 380 L 490 420 C 580 440, 680 500, 680 600 Z" fill="url(#jacketGrad)" />
    
    <!-- Jacket Seams, Creases & Highlights -->
    <path d="M 250 460 C 230 520, 190 560, 160 600" stroke="#8C6542" stroke-width="3" fill="none" opacity="0.6" />
    <path d="M 550 460 C 570 520, 610 560, 640 600" stroke="#8C6542" stroke-width="3" fill="none" opacity="0.6" />

    <!-- White Undershirt Collar -->
    <path d="M 330 380 C 330 460, 470 460, 470 380 C 440 430, 360 430, 330 380 Z" fill="url(#shirtGrad)" />

    <!-- Jacket Wide Collars Over Shirt -->
    <!-- Left Collar -->
    <polygon points="310,380 340,480 380,450 345,395" fill="#B98B66" />
    <polygon points="310,380 338,475 370,445 342,392" fill="#D6AA85" />
    <!-- Right Collar -->
    <polygon points="490,380 460,480 420,450 455,395" fill="#A57A54" />
    <polygon points="490,380 462,475 430,445 458,392" fill="#C49A74" />

    <!-- Center Zip Line -->
    <line x1="400" y1="450" x2="400" y2="600" stroke="#D1D5DB" stroke-width="4" stroke-dasharray="4,2" />

    <!-- Neck & Throat -->
    <path d="M 345 320 L 345 390 C 370 415, 430 415, 455 390 L 455 320 Z" fill="#B97955" />
    <path d="M 360 330 C 400 375, 440 330, 440 330" stroke="#A06342" stroke-width="4" fill="none" opacity="0.5" />

    <!-- Ears -->
    <!-- Left Ear -->
    <ellipse cx="295" cy="285" rx="18" ry="32" transform="rotate(-10 295 285)" fill="#C68662" />
    <ellipse cx="295" cy="285" rx="10" ry="20" transform="rotate(-10 295 285)" fill="#A06342" opacity="0.6" />
    <!-- Right Ear -->
    <ellipse cx="505" cy="285" rx="18" ry="32" transform="rotate(10 505 285)" fill="#C68662" />
    <ellipse cx="505" cy="285" rx="10" ry="20" transform="rotate(10 505 285)" fill="#A06342" opacity="0.6" />

    <!-- Head & Face Structure -->
    <path d="M 305 220 C 300 170, 340 160, 400 160 C 460 160, 500 170, 495 220 C 495 280, 470 360, 400 370 C 330 360, 305 280, 305 220 Z" fill="url(#faceGrad)" />

    <!-- Cheekbones & Jaw Definition -->
    <path d="M 330 260 C 340 320, 370 355, 400 360 C 430 355, 460 320, 470 260" stroke="#AA6A49" stroke-width="2" fill="none" opacity="0.3" />

    <!-- Eyes & Brows -->
    <!-- Left Eyebrow -->
    <path d="M 325 210 Q 355 195 375 210" stroke="#1D130E" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Right Eyebrow -->
    <path d="M 425 210 Q 445 195 475 210" stroke="#1D130E" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Left Eye -->
    <ellipse cx="350" cy="235" rx="18" ry="11" fill="#FFFFFF" />
    <circle cx="351" cy="235" r="9" fill="#3D2314" />
    <circle cx="351" cy="235" r="4" fill="#0A0604" />
    <circle cx="348" cy="232" r="2.5" fill="#FFFFFF" />
    <!-- Upper Eyelid Left -->
    <path d="M 332 233 Q 351 223 368 234" stroke="#26160F" stroke-width="3" fill="none" />

    <!-- Right Eye -->
    <ellipse cx="450" cy="235" rx="18" ry="11" fill="#FFFFFF" />
    <circle cx="449" cy="235" r="9" fill="#3D2314" />
    <circle cx="449" cy="235" r="4" fill="#0A0604" />
    <circle cx="446" cy="232" r="2.5" fill="#FFFFFF" />
    <!-- Upper Eyelid Right -->
    <path d="M 432 234 Q 449 223 468 233" stroke="#26160F" stroke-width="3" fill="none" />

    <!-- Nose -->
    <path d="M 400 215 L 396 270 Q 388 285 400 288 Q 412 285 404 270 Z" fill="#BC7B57" opacity="0.75" />
    <ellipse cx="388" cy="286" rx="5" ry="3" fill="#8C5233" opacity="0.6" />
    <ellipse cx="412" cy="286" rx="5" ry="3" fill="#8C5233" opacity="0.6" />

    <!-- Mustache & Beard -->
    <!-- Trimmed Mustache -->
    <path d="M 370 310 Q 400 300 430 310 Q 415 320 400 316 Q 385 320 370 310 Z" fill="#201510" opacity="0.9" />

    <!-- Lips with Gentle Smile -->
    <path d="M 368 322 Q 400 334 432 322" stroke="#A75845" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 378 324 Q 400 340 422 324" fill="#8A4032" opacity="0.7" />

    <!-- Chin Goatee -->
    <path d="M 388 348 Q 400 342 412 348 Q 406 364 400 366 Q 394 364 388 348 Z" fill="#1C120D" opacity="0.85" />

    <!-- Voluminous Styled Modern Hair (Quiff) -->
    <path d="M 280 180 C 270 120, 290 60, 350 35 C 380 20, 440 15, 490 35 C 550 55, 560 120, 540 180 C 530 150, 510 130, 480 120 C 440 100, 350 110, 310 150 Z" fill="url(#hairGrad)" />
    
    <!-- Dynamic Hair Texture Strands -->
    <path d="M 330 50 Q 400 25 450 65 Q 490 40 520 70" stroke="#4A3025" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 300 110 Q 360 65 420 85 Q 470 60 500 100" stroke="#3D261C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 360 35 Q 410 15 470 35" stroke="#FF5722" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 285 140 Q 310 90 350 60" stroke="#FF7043" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Orange / Warm Rim Light Glow on Left Hair Edge -->
    <path d="M 280 170 C 275 125, 295 65, 350 35" stroke="#FF5722" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>